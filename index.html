:root{--bg:#f5f4f0;--card:#fff;--ink:#1b1b1b;--mut:#5f6368;--line:#e3e1db;--blue:#1351b4;--onblue:#fff;--appbar:#0c326f;--yel:#ffc800;--tint:#ecf1f7;--redbg:#fde0db;--redink:#8b0a03;--grn:#168821;--grnbg:#e3f5e1;--gfill:#168821;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13171f;--card:#252f3e;--ink:#f6f6f6;--mut:#adadad;--line:#2f4668;--blue:#81aefc;--onblue:#071d41;--appbar:#071d41;--tint:#13171f;--redbg:#5c1111;--redink:#fdb8ae;--grn:#70e17b;--grnbg:#19311e;--gfill:#70e17b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13171f;--card:#252f3e;--ink:#f6f6f6;--mut:#adadad;--line:#2f4668;--blue:#81aefc;--onblue:#071d41;--appbar:#071d41;--tint:#13171f;--redbg:#5c1111;--redink:#fdb8ae;--grn:#70e17b;--grnbg:#19311e;--gfill:#70e17b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Rawline,Raleway,"Segoe UI",Arial,sans-serif}
header{background:var(--appbar);color:#fff;position:sticky;top:0;z-index:5}
.bar{max-width:640px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:700;font-size:20px;color:#fff}
.tag{font-size:12px;background:var(--yel);color:#1b1b1b;padding:2px 10px;border-radius:99px;font-weight:600}
main{max-width:640px;margin:0 auto;padding:20px 16px 96px}
h1{display:inline;font-size:26px;font-weight:700;line-height:1.6;margin:0;padding:0 4px;background:linear-gradient(transparent 62%,var(--yel) 62%);box-decoration-break:clone;-webkit-box-decoration-break:clone;color:#1b1b1b}
h2{font-size:19px;font-weight:600;margin:28px 0 10px}
strong{font-weight:600}
p{margin:0 0 8px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:12px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#1351b4,#0c326f);color:#fff;border-radius:6px;padding:20px 20px 20px 28px;margin:16px 0}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--yel)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;background:rgba(255,255,255,.09);transform:rotate(30deg)}
.hero>*{position:relative;z-index:1}
.hero .mut{color:#d4e5ff}
.bartrack{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.hero .bartrack{background:rgba(255,255,255,.3)}
.fill{height:100%;background:var(--gfill);border-radius:99px}
.hero .fill{background:var(--yel)}
.btn{display:inline-block;border:1px solid var(--blue);background:var(--blue);color:var(--onblue);font:inherit;font-weight:600;padding:8px 24px;border-radius:99px;cursor:pointer;min-height:44px}
.btn.alt{background:transparent;color:var(--blue)}
.hero .btn{background:var(--yel);border-color:var(--yel);color:#1b1b1b}
.btn:disabled,.btn.alt:disabled{background:var(--redbg);color:var(--redink);border-color:transparent;cursor:not-allowed}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.chip{display:inline-block;font-size:13px;padding:2px 12px;border-radius:99px;border:1px solid var(--line);margin:0 6px 6px 0;background:var(--tint)}
.chip.ok{background:var(--grnbg);color:var(--grn);border-color:transparent;font-weight:600}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:14px 0 16px;overflow-x:auto}
.tb{flex:1;background:none;border:0;border-bottom:3px solid transparent;font:inherit;font-size:13px;letter-spacing:.3px;text-transform:uppercase;color:var(--mut);padding:12px 8px;cursor:pointer;min-height:44px;white-space:nowrap}
.tb.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.row{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--blue);color:var(--onblue);display:grid;place-items:center;font-weight:700}
.num.done{background:var(--grn);color:var(--card)}
.num.lock{background:var(--line);color:var(--mut)}
.status{font-size:12px;font-weight:600;text-align:right}
.status.done{color:var(--grn)}.status.cur{color:var(--blue)}.status.lock{color:var(--mut)}
.list{padding:0;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.item:last-child{border-bottom:0}
.item .mid{flex:1}
.item small{display:block;color:var(--mut);font-size:12px}
.item b{color:var(--blue);font-weight:600}
textarea{width:100%;min-height:120px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--mut);border-radius:4px;padding:10px;resize:vertical}
.msg{font-size:14px;color:var(--redink);background:var(--redbg);padding:8px 12px;border-radius:4px;margin:8px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);box-shadow:0 -2px 8px rgba(0,0,0,.08);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;font:inherit;font-size:11px;color:var(--mut);padding:10px 4px 10px;cursor:pointer;min-height:56px}
nav button[aria-current="page"]{color:var(--blue);font-weight:700}
nav svg{display:block;margin:0 auto 2px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl p{margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--blue);color:var(--onblue);padding:10px 16px;border-radius:6px;z-index:9;font-size:14px;max-width:90%}
.foot{font-size:12px;color:var(--mut);text-align:center;margin-top:24px}
.quote{border-left:4px solid var(--yel);padding-left:12px;font-size:14px;color:var(--mut);margin:8px 0}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:0 0 8px;cursor:pointer}
.opt.on{border-color:var(--blue);background:var(--tint);box-shadow:inset 4px 0 0 var(--blue)}
.opt:disabled{cursor:default}
input[type=range]{accent-color:var(--blue)}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .4s}}
</style>
</head>
<body>
<header><div class="bar"><span class="brand">Primeiro Passo</span><span class="tag">Protótipo com dados fictícios</span></div></header>
<main id="app"></main>
<nav aria-label="Principal"><div id="tabs"></div></nav>
<div id="toast" class="toast" role="status" hidden></div>
<script>
var MODS=[
{t:"Mundo corporativo e postura",k:"Socioemocional",h:"1h30",s:"Postura profissional",d:"Como funciona uma empresa: horários, hierarquia, regras não escritas e o que esperam de você no primeiro dia.",p:"Escreva em 5 linhas como será o seu primeiro dia de trabalho.",q:"No primeiro dia, você não entendeu uma tarefa. O que faz?",o:[["Faz do jeito que acha e torce para dar certo",0],["Pergunta ao responsável com calma e anota a orientação",2],["Espera alguém perceber que você está perdido",1]]},
{t:"Comunicação escrita e e-mail",k:"Técnica",h:"2h",s:"Comunicação escrita",d:"Como escrever mensagens claras, educadas e objetivas para colegas, gestores e clientes.",p:"Escreva um e-mail pedindo uma informação a outro setor da empresa.",q:"Você errou uma informação num e-mail que já foi enviado.",o:[["Avisa na hora, corrige e explica o que mudou",2],["Torce para ninguém perceber",0],["Corrige sem avisar ninguém",1]]},
{t:"Atendimento ao cliente",k:"Socioemocional",h:"2h",s:"Atendimento",d:"Escuta, empatia e como resolver problemas sem perder a calma, pessoalmente e por mensagem.",p:"Responda a um cliente que recebeu o produto errado.",q:"Um cliente fica irritado e levanta a voz com você.",o:[["Escuta até o fim, reconhece o problema e propõe uma solução",2],["Responde no mesmo tom",0],["Passa o cliente para outra pessoa sem explicar",1]]},
{t:"Planilhas do dia a dia",k:"Técnica",h:"3h",s:"Planilhas",d:"Tabelas, somas, filtros e organização de dados, o suficiente para a rotina de um escritório.",p:"Descreva como montaria uma planilha de controle de despesas do mês.",q:"Um colega pede ajuda com uma planilha, mas você está com prazo.",o:[["Combina um horário para ajudar depois de entregar a sua parte",2],["Ajuda agora e atrasa a sua entrega",1],["Diz que não pode e sai",0]]},
{t:"Organização e rotina de escritório",k:"Técnica",h:"2h",s:"Organização",d:"Arquivar documentos, controlar prazos, usar agenda e priorizar tarefas.",p:"Monte um checklist da rotina semanal de um setor administrativo.",q:"O chefe muda a prioridade da semana de última hora.",o:[["Pergunta o que muda, reorganiza a lista e avisa o que vai atrasar",2],["Reclama com os colegas",0],["Tenta fazer tudo ao mesmo tempo",1]]},
{t:"Preparação para entrevista",k:"Socioemocional",h:"1h30",s:"Entrevista",d:"Como se apresentar, falar da sua história e responder perguntas difíceis com segurança.",p:"Escreva sua resposta para “fale um pouco sobre você”.",q:"Na entrevista, perguntam qual é o seu ponto fraco.",o:[["Cita um ponto real e o que faz para melhorar",2],["Diz que não tem nenhum",0],["Muda de assunto",1]]}];
var VAGAS=[
{id:1,r:"Jovem aprendiz administrativo",c:"Indústria metalúrgica (exemplo)",t:"Aprendiz",req:[1,2,3]},
{id:2,r:"Estagiário de atendimento",c:"Escritório de contabilidade (exemplo)",t:"Estágio",req:[2,3]},
{id:3,r:"Auxiliar administrativo",c:"Rede de supermercados (exemplo)",t:"Efetivo",req:[1,2,4,5]},
{id:4,r:"Auxiliar de recepção",c:"Clínica de saúde (exemplo)",t:"Efetivo",req:[1,3,6]}];
var KEY="pp-proto-2",S=load(),SEL={},MIN=70,TAB="inicio",OPEN=null,FIL="Todas",ERR="";
function init(){return{done:[1,2],sim:{1:2,2:2},proj:{1:"Chegar 10 minutos antes, cumprimentar a equipe, levar caderno e perguntar quem é o meu responsável.",2:"Assunto: Dúvida sobre o prazo de entrega. Olá, tudo bem? Poderia me informar até quando o pedido 124 precisa ser enviado? Obrigado!"},apps:[],log:[{t:"Concluiu o módulo 2: Comunicação escrita e e-mail",w:"há 2 dias"},{t:"Concluiu o módulo 1: Mundo corporativo e postura",w:"há 5 dias"},{t:"Cadastro feito com o e-mail escolar",w:"há 6 dias"}]}}
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return init()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cur(){for(var i=1;i<=MODS.length;i++)if(S.done.indexOf(i)<0)return i;return 0}
function pct(){return Math.round(S.done.length/MODS.length*100)}
function missing(v){return v.req.filter(function(n){return S.done.indexOf(n)<0})}
function toast(m){var e=document.getElementById("toast");e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},2600)}
function bar(){return '<div class="bartrack"><div class="fill" style="width:'+pct()+'%"></div></div>'}
function vagaCard(v){var m=missing(v),ap=S.apps.indexOf(v.id)>=0;
var sk=v.req.map(function(n){return '<span class="chip'+(S.done.indexOf(n)>=0?' ok':'')+'">'+esc(MODS[n-1].s)+'</span>'}).join("");
var b=ap?'<span class="chip ok">Candidatura enviada</span>':m.length?'<button class="btn alt" disabled>Faltam '+m.length+' módulo'+(m.length>1?'s':'')+'</button>':'<button class="btn" data-act="apply" data-id="'+v.id+'">Candidatar-me</button>';
return '<div class="card"><p><strong>'+esc(v.r)+'</strong></p><p class="mut">'+esc(v.c)+'<br>'+v.t+', Joinville, SC</p><p class="mut">Competências pedidas pela empresa:</p><div>'+sk+'</div>'+b+'</div>'}
function home(){var c=cur(),h='<h1>Olá, João</h1><p class="mut">Seu caminho até o primeiro emprego, passo a passo.</p><div class="hero"><p class="mut">Sua trilha</p><p style="font-size:20px;font-weight:700;margin:0">Assistente administrativo</p>'+bar()+'<p class="mut">'+S.done.length+' de '+MODS.length+' módulos concluídos</p>';
h+=c?'<p style="margin:12px 0 0"><button class="btn" data-act="go" data-tab="trilhas" data-mod="'+c+'">Continuar: módulo '+c+'</button></p>':'<p style="margin:12px 0 0">Trilha concluída. Veja as vagas liberadas.</p>';
h+='</div><h2>Vagas mais perto de você</h2>';
var vs=VAGAS.slice().sort(function(a,b){return missing(a).length-missing(b).length}).slice(0,2);
h+=vs.map(vagaCard).join("")+'<p><button class="btn alt" data-act="go" data-tab="vagas">Ver todas as vagas</button></p>';
h+='<h2>Como funciona</h2><div class="card"><div class="row"><span class="num">1</span><div><strong>Aprenda</strong><p class="mut">Módulos curtos, feitos com base no que as empresas da cidade pedem.</p></div></div><div class="row"><span class="num">2</span><div><strong>Prove</strong><p class="mut">Cada módulo termina com um mini-projeto e uma situação do dia a dia, que vão para o seu perfil.</p></div></div><div class="row"><span class="num">3</span><div><strong>Candidate-se</strong><p class="mut">As vagas se abrem conforme você avança, e as empresas só veem quem está pronto.</p></div></div></div>';
return h}
function trilhas(){
if(OPEN){var n=OPEN,m=MODS[n-1],dn=S.done.indexOf(n)>=0,c=cur(),h='<p><button class="btn alt" data-act="back">Voltar às trilhas</button></p><h1>Módulo '+n+': '+esc(m.t)+'</h1><p class="mut">'+m.h+', competência: '+esc(m.s)+'</p><div class="card"><p>'+esc(m.d)+'</p></div><h2>Mini-projeto</h2><div class="card"><p>'+esc(m.p)+'</p>';
if(n>c&&!dn)return h+'<div class="msg">Conclua o módulo '+c+' antes de abrir este.</div></div>';
h+='<textarea id="proj" aria-label="Seu mini-projeto" '+(dn?'readonly':'')+'>'+esc(S.proj[n]||"")+'</textarea>';
h+='</div><h2>Situação do dia a dia</h2><div class="card"><p>'+esc(m.q)+'</p>'+m.o.map(function(o,i){var on=(dn?S.sim[n]:SEL[n])===i;return '<button class="opt'+(on?' on':'')+'" data-act="opt" data-i="'+i+'"'+(dn?' disabled':'')+'>'+esc(o[0])+'</button>'}).join("");
if(ERR)h+='<div class="msg">'+ERR+'</div>';
h+=dn?'<p class="status done" style="margin-top:8px">Concluído e salvo no seu perfil</p>':'<p style="margin-top:8px"><button class="btn" data-act="finish" data-mod="'+n+'">Entregar e concluir módulo</button></p>';
return h+'</div>'}
var h='<h1>Trilhas</h1><p class="mut">Cada módulo vale uma competência no seu perfil.</p><div class="card"><p><strong>Assistente administrativo</strong></p>'+bar()+'<p class="mut">'+pct()+'% concluído</p></div>';
h+='<div class="card list">'+MODS.map(function(m,i){var n=i+1,dn=S.done.indexOf(n)>=0,c=cur(),st=dn?"done":n===c?"cur":"lock";return '<button class="item" data-act="open" data-mod="'+n+'"><span class="num '+st+'">'+(dn?"✓":n)+'</span><span class="mid"><small>Módulo '+n+', '+m.h+'</small><b>'+esc(m.t)+'</b></span><span class="status '+st+'">'+(dn?"Concluído":n===c?"Em andamento":"Bloqueado")+'</span></button>'}).join("")+'</div>';
h+='<h2>Próximas trilhas</h2><div class="card"><p class="mut">Comércio e varejo, tecnologia e atendimento digital entram na fase 2, junto com novas empresas parceiras.</p></div>';
return h}
function vagas(){var ts=["Todas","Aprendiz","Estágio","Efetivo"],h='<h1>Vagas</h1><p class="mut">As empresas parceiras definem as competências. Você se candidata quando concluir os módulos pedidos.</p><div class="tabs">'+ts.map(function(t){return '<button class="tb'+(t===FIL?' on':'')+'" data-act="fil" data-t="'+t+'">'+t+'</button>'}).join("")+'</div>';
return h+VAGAS.filter(function(v){return FIL==="Todas"||v.t===FIL}).map(vagaCard).join("")}
function perfil(){var h='<div class="card row"><span class="num" style="width:56px;height:56px;font-size:24px">J</span><div><h1 style="margin:0">João da Silva</h1><p class="mut">16 anos, Joinville, SC<br>Escola pública, e-mail escolar verificado</p></div></div>';
h+='<div class="card"><p><strong>Desenvolvimento até aqui</strong></p>'+bar()+'<p class="mut">'+S.done.length+' de '+MODS.length+' módulos, '+S.apps.length+' candidatura'+(S.apps.length===1?'':'s')+'</p></div>'+prontCard()+'<h2>Competências conquistadas</h2><div>';
h+=S.done.length?S.done.slice().sort().map(function(n){return '<span class="chip ok">'+esc(MODS[n-1].s)+'</span>'}).join(""):'<p class="mut">Conclua um módulo para ganhar a primeira competência.</p>';
h+='</div><h2>Portfólio</h2>';
h+=S.done.length?S.done.slice().sort().map(function(n){var t=S.proj[n]||"";return '<div class="card"><p><strong>'+esc(MODS[n-1].t)+'</strong></p><p class="quote">'+esc(t.length>140?t.slice(0,140)+"…":t)+'</p></div>'}).join(""):'<div class="card"><p class="mut">Seus mini-projetos aparecem aqui.</p></div>';
h+='<h2>Candidaturas</h2>';
h+=S.apps.length?S.apps.map(function(id){var v=VAGAS.filter(function(x){return x.id===id})[0];return '<div class="card"><strong>'+esc(v.r)+'</strong><p class="mut">'+esc(v.c)+'</p></div>'}).join(""):'<div class="card"><p class="mut">Nenhuma candidatura ainda. As vagas se abrem conforme você avança na trilha.</p></div>';
h+='<h2>Histórico</h2><div class="tl">'+S.log.map(function(l){return '<p>'+esc(l.t)+'<br><span class="mut">'+esc(l.w)+'</span></p>'}).join("")+'</div>';
h+='<p><button class="btn alt" data-act="reset">Reiniciar demonstração</button></p>';
return h}
function tecP(){var t=[],i;for(i=0;i<MODS.length;i++)if(MODS[i].k==="Técnica")t.push(i+1);return Math.round(t.filter(function(n){return S.done.indexOf(n)>=0}).length/t.length*100)}
function socP(){var x=0;for(var k in S.sim)if(S.done.indexOf(+k)>=0)x+=MODS[k-1].o[S.sim[k]][1];return Math.round(x/(2*MODS.length)*100)}
function prt(){return Math.round((tecP()+socP())/2)}
function mb(l,v){return '<p class="mut" style="margin:10px 0 0">'+l+', '+v+'%</p><div class="bartrack" style="margin:4px 0"><div class="fill" style="width:'+v+'%"></div></div>'}
function prontCard(){var p=prt(),ok=p>=70;return '<div class="card"><p><strong>Prontidão para as empresas</strong></p>'+mb("Técnica",tecP())+mb("Socioemocional",socP())+'<p style="margin-top:12px"><span class="chip '+(ok?'ok':'')+'">'+(ok?'Pronto para indicação às empresas':'Em formação, '+p+'% de 70%')+'</span></p><p class="mut">Você é avaliado pelo que entrega na trilha e pelas escolhas nas situações do dia a dia. Escola e bairro não entram na conta.</p></div>'}
var CANDS=[{n:"Ana Costa",t:100,s:92},{n:"Maria Oliveira",t:100,s:83},{n:"Pedro Lima",t:67,s:75},{n:"Beatriz Souza",t:67,s:58},{n:"Lucas Martins",t:33,s:50}];
function empList(){var all=CANDS.map(function(c){return{n:c.n,t:c.t,s:c.s}}).concat([{n:"João da Silva (você)",t:tecP(),s:socP()}]).map(function(c){c.p=Math.round((c.t+c.s)/2);return c}).sort(function(a,b){return b.p-a.p}),ok=all.filter(function(c){return c.p>=MIN});
return '<p class="mut">'+ok.length+' de '+all.length+' candidatos passam no filtro. A triagem manual de '+(all.length-ok.length)+' currículos foi evitada.</p>'+ok.map(function(c){return '<div class="card"><p><strong>'+esc(c.n)+'</strong> <span class="chip ok">Prontidão '+c.p+'%</span></p>'+mb("Técnica",c.t)+mb("Socioemocional",c.s)+'</div>'}).join("")}
function empresa(){return '<h1>Empresa parceira</h1><p class="mut">Vaga: jovem aprendiz administrativo (exemplo). A empresa só vê quem atingiu a prontidão mínima que ela define.</p><div class="card"><p><label for="min"><strong>Prontidão mínima: <span id="minv">'+MIN+'</span>%</strong></label></p><input id="min" type="range" min="0" max="100" step="5" value="'+MIN+'" style="width:100%"></div><div id="lst">'+empList()+'</div>'}
var ICONS={inicio:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',trilhas:'<path d="M4 20c0-6 6-4 8-8s-4-6 0-9M16 5h4M16 12h4M4 4h2"/>',vagas:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3"/>',empresa:'<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 8h2M13 8h2M9 12h2M13 12h2M10 21v-4h4v4"/>',perfil:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
var NAMES={inicio:"Início",trilhas:"Trilhas",vagas:"Vagas",perfil:"Perfil",empresa:"Empresa"};
function render(){var v={inicio:home,trilhas:trilhas,vagas:vagas,perfil:perfil,empresa:empresa}[TAB]();
document.getElementById("app").innerHTML=v+'<p class="foot">Protótipo de demonstração. Empresas, vagas e dados são fictícios.</p>';
document.getElementById("tabs").innerHTML=Object.keys(NAMES).map(function(k){return '<button data-act="go" data-tab="'+k+'"'+(k===TAB?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[k]+'</svg>'+NAMES[k]+'</button>'}).join("")}
function go(t,m){TAB=t;OPEN=m?+m:null;ERR="";if(location.hash!=="#"+t)location.hash=t;render();window.scrollTo(0,0)}
document.addEventListener("click",function(e){var el=e.target.closest("[data-act]");if(!el)return;var a=el.dataset.act;
if(a==="go")go(el.dataset.tab,el.dataset.mod);
else if(a==="open"){OPEN=+el.dataset.mod;ERR="";render();window.scrollTo(0,0)}
else if(a==="opt"){var pe=document.getElementById("proj");if(pe)S.proj[OPEN]=pe.value;SEL[OPEN]=+el.dataset.i;ERR="";render()}
else if(a==="back"){OPEN=null;ERR="";render()}
else if(a==="fil"){FIL=el.dataset.t;render()}
else if(a==="finish"){var n=+el.dataset.mod,t=document.getElementById("proj").value.trim();
if(t.length<20){ERR="Escreva pelo menos 20 caracteres para entregar o mini-projeto.";S.proj[n]=t;render();return}
if(SEL[n]===undefined){ERR="Escolha uma resposta para a situação do dia a dia.";S.proj[n]=t;render();return}S.sim[n]=SEL[n];S.proj[n]=t;S.done.push(n);S.log.unshift({t:"Concluiu o módulo "+n+": "+MODS[n-1].t,w:"agora"});save();ERR="";OPEN=null;render();toast("Módulo concluído. Competência “"+MODS[n-1].s+"” conquistada.")}
else if(a==="apply"){var v=VAGAS.filter(function(x){return x.id===+el.dataset.id})[0];S.apps.push(v.id);S.log.unshift({t:"Candidatou-se a "+v.r,w:"agora"});save();render();toast("Candidatura enviada para "+v.c+".")}
else if(a==="reset"){S=init();save();OPEN=null;render();toast("Demonstração reiniciada.")}});
document.addEventListener("input",function(e){if(e.target.id==="min"){MIN=+e.target.value;document.getElementById("minv").textContent=MIN;document.getElementById("lst").innerHTML=empList()}});
window.addEventListener("hashchange",function(){var t=location.hash.slice(1);if(NAMES[t]&&t!==TAB){TAB=t;OPEN=null;render()}});
(function(){var t=location.hash.slice(1);if(NAMES[t])TAB=t;render()})();
</script>
</body>
</html>
